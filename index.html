<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>minigamma2 · AI 簡報生成工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap">
<script src="https://js.puter.com/v2/"></script>
<style>
/* ================= App UI ================= */
:root{
  --u-bg:#f6f5fb;--u-panel:#fff;--u-text:#1c1b29;--u-muted:#6b6a80;--u-border:#e4e2f0;
  --u-acc:#6d4aff;--u-acc2:#ff7a59;--u-accfg:#fff;--u-danger:#d64545;--u-soft:#efecff;
  --u-shadow:0 8px 30px rgba(60,40,140,.10);
}
:root[data-theme="dark"]{
  --u-bg:#14131c;--u-panel:#1d1c29;--u-text:#ecebf6;--u-muted:#9996b3;--u-border:#2d2b3f;
  --u-acc:#8b6dff;--u-acc2:#ff8d6e;--u-soft:#2a2547;--u-danger:#f07a7a;--u-shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 Inter,"Noto Sans TC",system-ui,sans-serif;background:var(--u-bg);color:var(--u-text);overflow:hidden;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
#top{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--u-border);background:var(--u-panel);position:relative;z-index:20}
.brand{border:0;background:none;font-size:18px;font-weight:700;display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:8px}
.brand i{font-style:normal;background:linear-gradient(135deg,var(--u-acc),var(--u-acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dt{border:1px solid transparent;background:none;font-weight:600;font-size:15px;padding:5px 10px;border-radius:8px;min-width:120px;width:min(360px,30vw)}
.dt:hover{border-color:var(--u-border)}.dt:focus{outline:0;border-color:var(--u-acc);background:var(--u-bg)}
.sp{flex:1}
.btn{border:1px solid var(--u-border);background:var(--u-panel);border-radius:10px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--u-acc)}
.btn.pri{background:var(--u-acc);border-color:var(--u-acc);color:var(--u-accfg);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--u-danger)}
.btn:disabled{opacity:.45;cursor:default}
#chip small{color:var(--u-muted)}
.pop{position:absolute;top:52px;right:12px;background:var(--u-panel);border:1px solid var(--u-border);border-radius:14px;box-shadow:var(--u-shadow);padding:10px;z-index:30;min-width:220px}
.pop h4{margin:2px 4px 8px;font-size:12px;color:var(--u-muted);font-weight:600}
.pop .item{display:flex;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;gap:8px}
.pop .item:hover{background:var(--u-soft)}
.themegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-width:300px}
.tsw{border:2px solid var(--u-border);border-radius:12px;padding:0;overflow:hidden;background:none;text-align:left}
.tsw.on{border-color:var(--u-acc)}
.tsw .pv{height:54px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.tsw .pv b{font-size:15px;line-height:1}
.tsw .pv i{display:block;height:4px;width:34px;border-radius:2px}
.tsw span.nm{display:block;font-size:12px;padding:4px 8px;color:var(--u-muted)}
main{flex:1;min-height:0;position:relative}
section.screen{position:absolute;inset:0;overflow:auto}

/* home */
.wrap{max-width:880px;margin:0 auto;padding:36px 20px 60px}
.hero{text-align:center;margin:18px 0 26px}
.hero h1{font-size:40px;line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--u-acc),var(--u-acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--u-muted);margin:0}
.pcard{background:var(--u-panel);border:1px solid var(--u-border);border-radius:22px;box-shadow:var(--u-shadow);padding:16px 18px 16px}
.seg{display:inline-flex;background:var(--u-bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--u-panel);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.pcard textarea{width:100%;border:0;outline:0;resize:vertical;background:none;font-size:17px;min-height:84px;line-height:1.6}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 12px}
.opts label,.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--u-muted)}
select,input[type=text],input[type=password],input[type=number],textarea.f{width:100%;font-size:14px;color:var(--u-text);background:var(--u-bg);border:1px solid var(--u-border);border-radius:10px;padding:8px 10px;outline:0}
select:focus,input:focus,textarea.f:focus{border-color:var(--u-acc)}
.swrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sw{width:46px;height:34px;border-radius:9px;border:2px solid var(--u-border);padding:0;position:relative;overflow:hidden}
.sw.on{border-color:var(--u-acc);box-shadow:0 0 0 2px var(--u-soft)}
.sw i{position:absolute;right:4px;bottom:4px;width:12px;height:12px;border-radius:50%}
.rowend{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--u-muted)}
.cta{border:0;background:linear-gradient(135deg,var(--u-acc),#9b6dff);color:#fff;padding:10px 22px;border-radius:12px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(109,74,255,.35)}
.cta:hover{filter:brightness(1.08)}.cta:disabled{opacity:.5;box-shadow:none;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 30px}
.chips button{border:1px solid var(--u-border);background:var(--u-panel);border-radius:999px;padding:6px 14px;font-size:13px}
.chips button:hover{border-color:var(--u-acc)}
.sec-h{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.sec-h h3{margin:0;font-size:16px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dk{background:var(--u-panel);border:1px solid var(--u-border);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.dk:hover{border-color:var(--u-acc);box-shadow:var(--u-shadow)}
.dk .pv{aspect-ratio:16/9;background:var(--u-soft);container-type:inline-size;overflow:hidden}
.dk .meta{padding:9px 12px;font-size:13px}
.dk .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .meta span{color:var(--u-muted);font-size:12px}
.dk .xdel{position:absolute;top:6px;right:6px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;width:26px;height:26px;opacity:0}
.dk:hover .xdel{opacity:1}

/* outline */
.olrow{display:flex;gap:10px;align-items:flex-start;background:var(--u-panel);border:1px solid var(--u-border);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.olrow .hd{cursor:grab;color:var(--u-muted);padding:6px 2px;user-select:none}
.olrow .no{width:26px;height:26px;border-radius:50%;background:var(--u-soft);color:var(--u-acc);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;margin-top:4px}
.olrow .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.olrow input.tt{border:0;background:none;font-weight:600;font-size:16px;padding:3px 4px;border-radius:6px;width:100%}
.olrow textarea.br{border:0;background:none;resize:none;color:var(--u-muted);font-size:13.5px;padding:3px 4px;width:100%;border-radius:6px;min-height:40px}
.olrow input:focus,.olrow textarea:focus{outline:0;background:var(--u-bg)}
.olrow select{width:auto;font-size:13px;padding:5px 8px;margin-top:3px}
.busy{display:flex;flex-direction:column;align-items:center;gap:14px;padding:90px 0;color:var(--u-muted)}
.spin{width:28px;height:28px;border:3px solid var(--u-border);border-top-color:var(--u-acc);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.errbox{background:var(--u-panel);border:1px solid var(--u-danger);color:var(--u-danger);border-radius:12px;padding:14px 16px;white-space:pre-wrap;margin:20px 0}

/* editor */
#editor{display:flex;overflow:hidden}
#thumbs{flex:none;width:176px;overflow:auto;padding:12px 10px;border-right:1px solid var(--u-border);background:var(--u-panel);display:flex;flex-direction:column;gap:10px}
.th{position:relative;border:2px solid var(--u-border);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--u-soft)}
.th.on{border-color:var(--u-acc)}
.th .cq{container-type:inline-size;pointer-events:none}
.th .n{position:absolute;left:4px;bottom:3px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:0 5px;z-index:3}
#canvas{flex:1;min-width:0;overflow:auto;padding:18px 24px 120px;scroll-behavior:smooth}
.col{max-width:980px;margin:0 auto}
#genbar{position:sticky;top:0;z-index:10;background:var(--u-panel);border:1px solid var(--u-border);border-radius:12px;box-shadow:var(--u-shadow);padding:8px 14px;display:flex;align-items:center;gap:12px;margin:0 auto 14px;max-width:980px}
#genbar .bar{flex:1;height:6px;background:var(--u-border);border-radius:4px;overflow:hidden}
#genbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--u-acc),var(--u-acc2));width:0;transition:width .3s}
.cwrap{position:relative}
.ctools{display:flex;align-items:center;gap:6px;margin:0 0 6px;opacity:0;transition:opacity .15s;flex-wrap:wrap}
.cwrap:hover .ctools,.cwrap:focus-within .ctools{opacity:1}
.ctools .pgn{font-size:12px;color:var(--u-muted);font-weight:600;margin-right:auto}
.ctools select{width:auto;padding:3px 8px;font-size:13px;border-radius:8px}
.cqbox{container-type:inline-size;border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(20,10,60,.14);border:1px solid var(--u-border)}
.cnotes{display:none;margin-top:8px}
.cwrap.shownotes .cnotes{display:block}
.cnotes textarea{width:100%;min-height:60px;resize:vertical}
.ins{height:30px;display:flex;align-items:center;justify-content:center;position:relative}
.ins::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed transparent}
.ins:hover::before{border-color:var(--u-acc)}
.ins button{position:relative;border:1px solid var(--u-border);background:var(--u-panel);border-radius:50%;width:24px;height:24px;line-height:1;opacity:0;padding:0}
.ins:hover button{opacity:1}
.ins button:hover{border-color:var(--u-acc);color:var(--u-acc)}

/* dialogs */
dialog{border:1px solid var(--u-border);background:var(--u-panel);color:var(--u-text);border-radius:18px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,25,.5)}
.m-head{padding:18px 22px 4px;font-size:18px;font-weight:700}
.m-body{padding:8px 22px;display:flex;flex-direction:column;gap:12px;max-height:68vh;overflow:auto}
.m-foot{padding:12px 22px 18px;display:flex;gap:8px;justify-content:flex-end}
.note{font-size:13px;color:var(--u-muted);background:var(--u-bg);border:1px dashed var(--u-border);border-radius:10px;padding:8px 12px}
.note code{background:var(--u-soft);padding:0 5px;border-radius:4px}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}.row>button{flex:none}
.ok{color:#2e9e5b}.bad{color:var(--u-danger)}
.imgres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgres button{border:2px solid transparent;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:16/10;background:var(--u-soft) center/cover no-repeat}
.imgres button:hover{border-color:var(--u-acc)}
.tabs2{display:flex;gap:4px;background:var(--u-bg);padding:3px;border-radius:10px;align-self:flex-start}
.tabs2 button{border:0;background:none;padding:4px 12px;border-radius:8px;font-size:13px}
.tabs2 button.on{background:var(--u-panel);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{border:1px solid var(--u-border);background:none;border-radius:999px;padding:3px 10px;font-size:12.5px}
.pchips button:hover{border-color:var(--u-acc)}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center}
.toast{background:#1c1b29;color:#fff;border-radius:10px;padding:8px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:80vw}
.toast.err{background:#b3382c}

/* present */
#present{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;user-select:none}
#stage{container-type:inline-size;position:relative;box-shadow:0 0 60px rgba(0,0,0,.6)}
#stage .fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:scale(.995)}to{opacity:1;transform:none}}
#pbar{position:absolute;left:0;bottom:0;height:3px;background:#8b6dff;transition:width .3s}
#pinfo{position:absolute;right:14px;bottom:10px;color:#fff;opacity:.5;font-size:13px}
#pnotes{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.82);color:#eee;padding:14px 22px;font-size:17px;line-height:1.6;max-height:30vh;overflow:auto}
#pexit{position:absolute;top:12px;right:14px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:4px 10px;opacity:0;transition:opacity .2s}
#present:hover #pexit{opacity:1}

/* print */
#printRoot{position:fixed;left:-10000px;top:0;width:1280px;pointer-events:none}
#printRoot .pslide{width:1280px;height:720px;overflow:hidden}
#printRoot .cqp{container-type:inline-size;width:1280px}
@media print{
  @page{size:1280px 720px;margin:0}
  body.printing{display:block;overflow:visible;height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{position:static;left:auto;pointer-events:auto}
  body.printing #printRoot .pslide{break-after:page;page-break-after:always}
}
@media (max-width:900px){
  #thumbs{display:none}.opts{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.dt{width:120px}
}

/* ================= Slide canvas (1em = 1.5625cqw → 64em × 36em) ================= */
.slide{position:relative;width:100%;aspect-ratio:16/9;font-size:1.5625cqw;line-height:1.35;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);text-align:left}
.slide *{box-sizing:border-box}
.slide h1,.slide h2,.slide h3,.slide p,.slide ul{margin:0;padding:0}
.slide .inner{position:absolute;inset:0;padding:2.4em 3.2em 2.2em;display:flex;flex-direction:column;min-height:0}
.slide h2{font-family:var(--head);font-size:2.05em;line-height:1.2;font-weight:700;letter-spacing:-.01em;flex:none;margin-bottom:.75em}
.slide h2::after{content:"";display:block;width:2.2em;height:.16em;background:var(--accent);border-radius:1em;margin-top:.4em}
.slide .pg{position:absolute;right:1.4em;bottom:.8em;font-size:.6em;color:var(--muted);z-index:2}
.slide .ed{outline:0;border-radius:.2em;cursor:text}
.slide .ed:hover{background:rgba(127,127,127,.13)}
.slide .ed:focus{background:rgba(127,127,127,.16);box-shadow:0 0 0 .1em var(--accent)}
.slide .ed:empty::before{content:attr(data-ph);opacity:.4}
.slide .ctl{opacity:0;transition:opacity .15s;border:0;cursor:pointer;font-family:Inter,"Noto Sans TC",sans-serif}
.cwrap:hover .slide .ctl,.slide .ctl:focus{opacity:1}
.slide .ctl.x{position:absolute;right:-1.5em;top:.1em;width:1.2em;height:1.2em;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:.8em;line-height:1;padding:0}
.slide .ctl.add{align-self:flex-start;margin-top:.8em;font-size:.62em;padding:.3em .9em;border-radius:2em;background:transparent;border:1px dashed var(--accent);color:var(--accent)}
.slide .ctl.imgbtn{position:absolute;right:1em;top:1em;z-index:5;font-size:.62em;padding:.35em .9em;border-radius:2em;background:rgba(0,0,0,.6);color:#fff}
.slide .ctl.imgbtn.big{position:static;font-size:.8em;opacity:1;background:var(--accent);color:var(--onacc)}
.slide .skelline{height:1.2em;border-radius:.4em;background:linear-gradient(90deg,rgba(127,127,127,.12),rgba(127,127,127,.28),rgba(127,127,127,.12));background-size:200% 100%;animation:sh 1.2s linear infinite;margin-bottom:.8em}
@keyframes sh{to{background-position:-200% 0}}
.slide .errmsg{color:#d64545;font-size:.9em;margin-bottom:1em;white-space:pre-wrap}
.slide .errbtn{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:.6em;padding:.3em 1em;font-size:.8em;cursor:pointer;align-self:flex-start}

/* cover / section / closing */
.L-title,.L-closing{background:linear-gradient(135deg,var(--cA),var(--cB));color:#fff}
.L-section{background:linear-gradient(135deg,var(--cB),var(--cA));color:#fff}
.slide .deco{position:absolute;inset:0;background:radial-gradient(circle at 88% 18%,rgba(255,255,255,.2) 0 16%,transparent 16.4%),radial-gradient(circle at 98% 88%,rgba(255,255,255,.1) 0 26%,transparent 26.4%),radial-gradient(circle at 70% 120%,var(--accent2) 0 22%,transparent 22.4%)}
.slide .bgimg{position:absolute;inset:0;background:center/cover no-repeat}
.slide .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.74),rgba(0,0,0,.2))}
.slide .cov{justify-content:center;padding:3em 4.5em;gap:.7em;z-index:2}
.slide .cov .h1{font-family:var(--head);font-size:3.3em;line-height:1.15;font-weight:700;letter-spacing:-.02em;max-width:78%;display:block}
.slide .cov .sub{font-size:1.35em;opacity:.88;max-width:70%;line-height:1.5}
.slide .cov .h1::after{content:"";display:block;width:2.4em;height:.18em;background:var(--accent2);border-radius:1em;margin-top:.45em}
.L-section .cov .num{font-family:var(--head);font-size:5em;font-weight:700;opacity:.28;line-height:1}
.L-closing .cov{align-items:center;text-align:center}
.L-closing .cov .h1,.L-closing .cov .sub{max-width:80%}
.L-closing .cov .h1::after{margin-left:auto;margin-right:auto}

/* bullets */
.slide .cols{flex:1;min-height:0;display:flex;gap:2.2em}
.slide .txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.slide ul.bl{list-style:none;display:flex;flex-direction:column;gap:.7em}
.slide ul.bl li{position:relative;padding-left:1.3em;line-height:1.4}
.slide ul.bl li::before{content:"";position:absolute;left:0;top:.5em;width:.5em;height:.5em;border-radius:50%;background:var(--accent)}
.slide .pic{background:var(--card) center/cover no-repeat;position:relative;overflow:hidden}
.slide .pic.side{flex:0 0 38%;border-radius:1em;margin:0 0 .4em}
.slide .pic.empty{display:flex;align-items:center;justify-content:center}
.slide .credit{position:absolute;left:.8em;bottom:.6em;font-size:.5em;background:rgba(0,0,0,.5);color:#fff;border-radius:.5em;padding:.15em .7em;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:4}
.slide .credit.covr{left:auto;right:1.2em;bottom:.8em}

/* split */
.slide .split{position:absolute;inset:0;display:grid;grid-template-columns:42% 1fr}
.slide .split.flip{grid-template-columns:1fr 42%}
.slide .split.flip .pic{order:2}
.slide .split .pic{height:100%}
.slide .split .txt2{position:relative;inset:auto;padding:2.4em 3em 2.2em 2.8em}
.slide .split .txt2 .txt{justify-content:center}

/* cards */
.slide .cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-auto-rows:var(--ch,14em);gap:1.1em;align-content:center}
.slide .cd{position:relative;background:var(--card);border-radius:1em;padding:1.5em 1.4em;display:flex;flex-direction:column;justify-content:center;gap:.6em}
.slide .ico{width:3em;height:3em;border-radius:.8em;background:var(--accent);color:var(--onacc);display:grid;place-items:center;margin-bottom:.2em}
.slide .ico svg{width:1.6em;height:1.6em}
.slide .cd h3{font-family:var(--head);font-size:1.4em;line-height:1.25;display:block}
.slide .cd p{font-size:1.05em;color:var(--muted);line-height:1.5;display:block}
.slide .cd .ctl.x{right:.5em;top:.5em}

/* stats */
.slide .stats{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.4em;align-content:center}
.slide .st{position:relative;border-top:.18em solid var(--accent);padding-top:.9em}
.slide .st .v{font-family:var(--head);font-size:3.4em;line-height:1.05;font-weight:700;color:var(--accent);display:block;letter-spacing:-.02em}
.slide .st .l{font-size:1.05em;color:var(--muted);margin-top:.4em;display:block}
.slide .st .ctl.x{right:0;top:.4em}
.slide .subline{font-size:1.05em;color:var(--muted);margin:-.4em 0 1em}

/* quote */
.L-quote{background:var(--card)}
.slide .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 4em;position:relative}
.slide .qmark{font-family:Georgia,serif;font-size:8em;line-height:.6;color:var(--accent);height:.5em}
.slide .qtext{font-family:var(--head);font-size:2em;line-height:1.4;font-weight:600;display:block}
.slide .qauth{margin-top:1.1em;color:var(--muted);font-size:1.1em;display:block}
.slide .qauth::before{content:"— "}

/* timeline */
.slide .tl{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.4em;align-content:center}
.slide .step{position:relative;padding-top:3.5em}
.slide .step .num{position:absolute;top:0;left:0;width:2.4em;height:2.4em;border-radius:50%;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font-weight:700;font-size:1.05em}
.slide .step::before{content:"";position:absolute;top:1.1em;left:2.6em;right:-1.2em;height:.14em;background:var(--accent);opacity:.3}
.slide .step:last-child::before{display:none}
.slide .step h3{font-family:var(--head);font-size:1.4em;margin-bottom:.3em;display:block}
.slide .step p{font-size:1.05em;color:var(--muted);line-height:1.5;display:block}
.slide .step .ctl.x{right:0;top:0}

/* compare */
.slide .cmp{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1.6em;position:relative}
.slide .cp{background:var(--card);border-radius:1em;overflow:hidden;display:flex;flex-direction:column}
.slide .cp .hd{padding:.8em 1.2em;font-family:var(--head);font-weight:700;font-size:1.25em;background:var(--accent);color:var(--onacc);display:block}
.slide .cp:nth-child(2) .hd{background:var(--accent2)}
.slide .cp .bd{padding:1em 1.2em;flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2.6em;height:2.6em;border-radius:50%;background:var(--bg);color:var(--fg);display:grid;place-items:center;font-weight:700;font-size:.9em;box-shadow:0 .2em .8em rgba(0,0,0,.2);z-index:3}

/* chart */
.slide .chartwrap{flex:1;min-height:0;display:grid;grid-template-columns:1.55fr 1fr;gap:2em}
.slide .chartwrap.solo{grid-template-columns:1fr}
.slide .cv{position:relative;min-height:0;background:var(--card);border-radius:1em;padding:1em}
.slide .cv .phc{height:100%;display:grid;place-items:center;font-size:2em;color:var(--muted)}
.slide .src{position:absolute;left:3.2em;bottom:.8em;font-size:.55em;color:var(--muted);max-width:60%}
</style>
</head>
<body>
<header id="top">
  <button class="brand" id="btnHome" title="回首頁"><i>✦</i> minigamma<span style="font-weight:400;color:var(--u-muted)">2</span></button>
  <input class="dt" id="deckTitle" hidden placeholder="簡報標題">
  <div class="sp"></div>
  <div id="edTools" style="display:flex;gap:8px" hidden>
    <button class="btn" id="btnTheme">🎨 主題</button>
    <button class="btn pri" id="btnPresent">▶ 簡報模式</button>
    <button class="btn" id="btnExport">⬇ 匯出</button>

    <button class="item" data-exp="json">💾 專案檔 (.json)</button>

</header>

<main>
  <section class="screen" id="home">
    <div class="wrap">
      <div class="hero"><h1>用 AI 把想法變成<em>好看的簡報</em></h1><p>輸入主題或貼上筆記 → 確認大綱 → 一頁頁生成,再直接在頁面上編輯。</p></div>
      <div class="pcard">
        <div class="seg"><button data-mode="topic" class="on">✦ 輸入主題</button><button data-mode="paste">📋 貼上文字</button></div>
        <textarea id="pPrompt" placeholder="例如:給新進員工的資訊安全入門,包含常見攻擊手法與日常防護"></textarea>
        <div class="opts">
          <label>頁數<select id="oPages"><option>5</option><option>8</option><option selected>10</option><option>12</option><option>15</option><option>20</option></select></label>
          <label>語言<select id="oLang"><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="auto">同輸入語言</option></select></label>
          <label>語氣<select id="oTone"><option value="professional">專業簡潔</option><option value="friendly">親切好懂</option><option value="academic">學術嚴謹</option><option value="lively">活潑有趣</option><option value="persuasive">說服力強</option></select></label>
          <label>圖片<select id="oImgs"><option value="commons">維基共享資源(免費圖庫)</option><option value="none">不使用圖片</option></select></label>
        </div>
        <div class="swrow" id="homeThemes"></div>
        <div class="rowend"><span class="hint" id="homeHint"></span><button class="cta" id="btnOutline">生成大綱 →</button></div>
      </div>
      <div class="chips" id="sugg"></div>
      <div class="sec-h"><h3>我的簡報</h3><div class="sp"></div>
        <button class="btn sm" id="btnImport">匯入專案檔</button><input type="file" id="fileImport" accept=".json,application/json" hidden></div>
      <div class="deckgrid" id="deckGrid"></div>
      <p class="hint" style="margin-top:22px">AI 不會上網查證:數據、人名與日期請自行確認。圖片來自 Wikimedia Commons(CC 授權),簡報中會自動標註作者與授權。</p>
    </div>
  </section>

  <section class="screen" id="outline" hidden>
    <div class="wrap">
      <div id="olBusy" class="busy" hidden><div class="spin"></div><div id="olBusyTxt">AI 正在規劃大綱…</div><button class="btn" id="olStop">取消</button></div>
      <div id="olErr" hidden></div>
      <div id="olBox" hidden>
        <div class="sec-h"><button class="btn sm" id="olBack">← 返回</button><h3>確認大綱</h3><div class="sp"></div><span class="hint">可編輯標題與說明、拖曳排序、切換版面</span></div>
        <div class="fld" style="margin-bottom:12px">簡報標題<input type="text" id="olTitle"></div>
        <div id="olList"></div>
        <button class="btn" id="olAdd">＋ 新增一頁</button>

      </div>
    </div>
  </section>

  <section class="screen" id="editor" hidden>

  </section>
</main>

<div id="present" hidden><div id="stage"></div><div id="pbar"></div><div id="pinfo"></div><div id="pnotes" hidden></div><button id="pexit">結束 (Esc)</button></div>
<div id="printRoot"></div>
<div id="toasts"></div>

<dialog id="settings"><form method="dialog" id="settingsForm">
  <div class="m-head">LLM 設定</div>
  <div class="m-body">
    <label class="fld">供應商<select id="provider">

      <option value="ollama">Ollama(本機)</option><option value="custom">本地 / 自訂 LLM(OpenAI 相容)</option></select></label>
    <div id="providerNote" class="note"></div>
    <label class="fld" id="fBase">API 位址 (Base URL)<input type="text" id="baseUrl" autocomplete="off"></label>
    <label class="fld" id="fKey">API Key<input type="password" id="apiKey" autocomplete="off" placeholder="sk-..."></label>
    <div class="row"><label class="fld">模型<input type="text" id="model" list="modelList" autocomplete="off"></label><button type="button" class="btn" id="fetchModels">取得清單</button></div>
    <datalist id="modelList"></datalist><div id="testMsg" style="font-size:13px"></div>
    <div class="row"><label class="fld">同時生成頁數(1–4)<input type="number" id="conc" min="1" max="4"></label><label class="fld">Temperature(留空=預設)<input type="number" id="temp" min="0" max="2" step="0.1"></label></div>
    <label class="fld">額外指示(附加到每次生成,可留空)<textarea class="f" id="system" rows="2" placeholder="例如:品牌名稱為「星河科技」,避免使用過度行銷的詞彙。"></textarea></label>

  </div>
  <div class="m-foot"><button type="button" class="btn" id="cancelSettings">取消</button><button type="submit" class="btn pri" value="save">儲存</button></div>
</form></dialog>

<dialog id="imgDlg"><form method="dialog">
  <div class="m-head">選擇圖片</div>
  <div class="m-body">
    <div class="tabs2" id="imgTabs"><button type="button" data-t="search" class="on">圖庫搜尋</button><button type="button" data-t="url">網址</button><button type="button" data-t="upload">上傳</button></div>

<dialog id="aiDlg"><form method="dialog">

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
/* ================= Utils ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clip=(s,n)=>{s=String(s??'');return s.length>n?s.slice(0,n):s};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),kind==='err'?6000:3200)}
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
const CE=(()=>{try{const d=document.createElement('div');d.contentEditable='plaintext-only';return d.contentEditable==='plaintext-only'?'plaintext-only':'true'}catch{return 'true'}})();
const cssUrl=u=>String(u).replace(/['"() \n]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'));
const safeName=s=>(String(s||'deck').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40))||'deck';
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

/* ================= Themes ================= */
const SANS="'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const THEMES={
  clean:   {name:'清爽',bg:'#ffffff',fg:'#1b1f2a',muted:'#5d6577',accent:'#4f46e5',accent2:'#f59e0b',card:'#f1f2fb',cA:'#4f46e5',cB:'#7c3aed',onAccent:'#ffffff',head:SANS,body:SANS,hpf:'Microsoft JhengHei',pf:'Microsoft JhengHei'},
  midnight:{name:'午夜',bg:'#0f172a',fg:'#e8edf7',muted:'#9aa7c2',accent:'#38bdf8',accent2:'#a78bfa',card:'#18233f',cA:'#0b1224',cB:'#1e3a8a',onAccent:'#06121f',head:SANS,body:SANS,hpf:'Microsoft JhengHei',pf:'Microsoft JhengHei'},
  paper:   {name:'紙本',bg:'#fbf7f0',fg:'#2b2520',muted:'#7a6e60',accent:'#c2562f',accent2:'#d99a2b',card:'#f1e9dc',cA:'#c2562f',cB:'#7d3419',onAccent:'#ffffff',head:"'Playfair Display','Noto Serif TC','Songti TC',serif",body:"'Noto Sans TC','Inter',sans-serif",hpf:'Georgia',pf:'Microsoft JhengHei'},
  forest:  {name:'森林',bg:'#f4f7f2',fg:'#1d2b22',muted:'#5e7064',accent:'#2f7d52',accent2:'#d9a441',card:'#e5eee6',cA:'#1f5f3f',cB:'#0f3a27',onAccent:'#ffffff',head:"'Noto Serif TC','Playfair Display',serif",body:"'Noto Sans TC','Inter',sans-serif",hpf:'Georgia',pf:'Microsoft JhengHei'},
  sunset:  {name:'日落',bg:'#fffaf5',fg:'#2a1b2e',muted:'#7d6a82',accent:'#e4572e',accent2:'#8338ec',card:'#fdeee6',cA:'#8338ec',cB:'#ff6b6b',onAccent:'#ffffff',head:"'Space Grotesk','Noto Sans TC',sans-serif",body:SANS,hpf:'Microsoft JhengHei',pf:'Microsoft JhengHei'},
  mono:    {name:'極簡黑白',bg:'#ffffff',fg:'#0a0a0a',muted:'#666666',accent:'#0a0a0a',accent2:'#ff3d00',card:'#f2f2f2',cA:'#0a0a0a',cB:'#2e2e2e',onAccent:'#ffffff',head:"'Space Grotesk','Noto Sans TC',sans-serif",body:SANS,hpf:'Microsoft JhengHei',pf:'Microsoft JhengHei'},
  aurora:  {name:'極光',bg:'#0b1020',fg:'#e9f1ff',muted:'#8fa3c7',accent:'#34d399',accent2:'#f472b6',card:'#141c33',cA:'#0b1020',cB:'#0f766e',onAccent:'#04201a',head:"'Space Grotesk','Noto Sans TC',sans-serif",body:SANS,hpf:'Microsoft JhengHei',pf:'Microsoft JhengHei'}
};
const themeStyle=T=>`--bg:${T.bg};--fg:${T.fg};--muted:${T.muted};--accent:${T.accent};--accent2:${T.accent2};--card:${T.card};--onacc:${T.onAccent};--cA:${T.cA};--cB:${T.cB};--head:${T.head};--body:${T.body}`;
const PAL=['#4f46e5','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16'];
const palette=(T,n)=>{const base=[T.accent,T.accent2,...PAL];return Array.from({length:Math.max(n,1)},(_,i)=>base[i%base.length])};

/* ================= Layouts & icons ================= */
const LAYOUTS={title:'封面',section:'章節',bullets:'條列',split:'圖文',cards:'卡片',stats:'數據',quote:'引言',timeline:'流程',compare:'對照',chart:'圖表',closing:'結尾'};
const ICONS='lightbulb rocket target users shield globe zap heart star trending-up clock lock settings book-open award compass flag layers cpu database cloud code message-circle mail phone map-pin calendar camera sparkles leaf building wallet factory graduation-cap brain wrench puzzle key eye thumbs-up smile coffee home truck shopping-cart search file-text chart-bar pie-chart check-circle'.split(' ');
const pascal=n=>n.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join('');
function iconNode(name){return (typeof lucide!=='undefined'&&lucide.icons)?(lucide.icons[pascal(name)]||lucide.icons.Lightbulb):null}
function iconSvg(name,color='currentColor',size=24){
  const n=iconNode(ICONS.includes(name)?name:'lightbulb'); if(!n) return '●';
  const inner=(n[2]||[]).map(([t,a])=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* ================= LLM providers (same as other tools) ================= */
const PROVIDERS={
  puter:{name:'Puter AI',defaults:{model:'gpt-5-nano'},models:['gpt-5-nano','gpt-5-mini','gpt-5','gpt-4.1-mini','claude-sonnet-4-5','claude-opus-4-5','gemini-2.5-flash','deepseek-chat'],
    note:'使用 <b>puter.js</b>(使用者付費模式):第一次送出時會跳出 Puter 登入視窗,不需自己的 API Key。生成簡報會呼叫多次模型。'},
  openai:{name:'OpenAI',defaults:{baseUrl:'https://api.openai.com/v1',apiKey:'',model:'gpt-4o-mini'},models:['gpt-4o-mini','gpt-4o','gpt-4.1','gpt-4.1-mini','gpt-5','gpt-5-mini'],
    note:'需要自己的 OpenAI API Key,只存在你的瀏覽器,請求由瀏覽器直接送往 OpenAI。'},
  ollama:{name:'Ollama',defaults:{baseUrl:'http://localhost:11434',model:'llama3.2'},models:[],
    note:'請先啟動 Ollama 並下載模型。若無法連線,設定環境變數 <code>OLLAMA_ORIGINS=*</code> 後重啟 Ollama。'},
  custom:{name:'本地/自訂',defaults:{baseUrl:'http://localhost:1234/v1',apiKey:'',model:''},models:[],
    note:'任何 OpenAI 相容 API:LM Studio(<code>:1234/v1</code>)、llama.cpp server、vLLM、LocalAI 等。需允許 CORS。'}
};
async function* streamPuter(cfg,messages,signal){
  if(typeof puter==='undefined') throw new Error('無法載入 puter.js(請確認網路連線,或改用其他供應商)。');
  const resp=await puter.ai.chat(messages,{model:cfg.model,stream:true});
  for await(const part of resp){if(signal.aborted)return;const t=part?.text??part?.message?.content?.[0]?.text??'';if(t)yield t}
}
async function* lines(res){const r=res.body.getReader(),d=new TextDecoder();let b='';while(true){const{done,value}=await r.read();if(done)break;b+=d.decode(value,{stream:true});const p=b.split('\n');b=p.pop();for(const x of p)yield x}if(b)yield b}
async function httpError(res){let b='';try{b=await res.text()}catch{}try{const j=JSON.parse(b);b=j.error?.message||j.error||b}catch{}return new Error(`HTTP ${res.status}:${String(b).slice(0,400)}`)}
async function* streamOpenAI(cfg,messages,signal){
  const base=(cfg.baseUrl||'').replace(/\/+$/,''),headers={'Content-Type':'application/json'};

  const res=await fetch(base+'/chat/completions',{method:'POST',headers,body:JSON.stringify(body),signal});
  if(!res.ok)throw await httpError(res);
  for await(const line of lines(res)){const l=line.trim();if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')return;try{const t=JSON.parse(d).choices?.[0]?.delta?.content;if(t)yield t}catch{}}

async function* streamOllama(cfg,messages,signal){
  const base=(cfg.baseUrl||'').replace(/\/+$/,'');

  if(!res.ok)throw await httpError(res);
  for await(const line of lines(res)){if(!line.trim())continue;let j;try{j=JSON.parse(line)}catch{continue}if(j.error)throw new Error(j.error);if(j.message?.content)yield j.message.content;if(j.done)return}

async function callLLM(messages,signal,onTok){

}
function extractJSON(text){
  let s=String(text||''); const m=s.match(/```(?:json)?\s*([\s\S]*?)```/); if(m&&m[1].includes('{'))s=m[1];
  const i=s.indexOf('{'); if(i<0)return null;
  let depth=0,inStr=false,esc_=false;
  for(let j=i;j<s.length;j++){
    const c=s[j];
    if(inStr){if(esc_)esc_=false;else if(c==='\\')esc_=true;else if(c==='"')inStr=false;continue}
    if(c==='"')inStr=true;else if(c==='{')depth++;else if(c==='}'){depth--;if(depth===0){
      const raw=s.slice(i,j+1);
      try{return JSON.parse(raw)}catch{try{return JSON.parse(raw.replace(/,\s*([}\]])/g,'$1'))}catch{return null}}
    }}
  }
  return null;
}

/* ================= Slide normalisation & layout conversion ================= */
const str=(v,max=200)=>String(v??'').replace(/\*\*|__|`/g,'').replace(/^#+\s*/,'').replace(/\s+/g,' ').trim().slice(0,max);
const arrS=(v,max,n)=>(Array.isArray(v)?v:[]).map(x=>typeof x==='string'?x:(x&&(x.text||x.point||x.title||x.heading))||'').map(x=>str(x,max)).filter(Boolean).slice(0,n);
function toBullets(s){
  if(s.bullets?.length)return s.bullets;
  if(s.items?.length)return s.items.map(i=>[i.heading,i.text].filter(Boolean).join('：'));
  if(s.stats?.length)return s.stats.map(x=>`${x.value} ${x.label}`);
  if(s.left||s.right)return [...(s.left?.points||[]),...(s.right?.points||[])];
  if(s.quote)return [s.quote];
  return [];
}
function toItems(s){
  if(s.items?.length)return s.items;
  return toBullets(s).slice(0,6).map(t=>{const m=t.split(/[：:]/);return m.length>1&&m[0].length<=14?{icon:'lightbulb',heading:m[0].trim(),text:m.slice(1).join('：').trim()}:{icon:'lightbulb',heading:clip(t,10),text:t}});
}
function ensureFields(s,L){
  const b=toBullets(s);
  if(L==='bullets'||L==='split'){if(!s.bullets?.length)s.bullets=b.length?b.slice(0,6):['點擊編輯內容']}
  if(L==='cards'||L==='timeline'){if(!s.items?.length||s.items.length<2){const it=toItems(s);s.items=it.length>=2?it:[{icon:'lightbulb',heading:'重點一',text:'說明'},{icon:'rocket',heading:'重點二',text:'說明'},{icon:'target',heading:'重點三',text:'說明'}]}}
  if(L==='stats'&&!s.stats?.length){s.stats=(b.length?b:['—']).slice(0,3).map(t=>{const m=String(t).match(/(\d[\d,.]*\s*[%％萬億倍xX]?)/);return{value:m?m[1].trim():'00',label:clip(t.replace(m?.[0]||'',''),24)||'點擊編輯'}})}
  if(L==='quote'&&!s.quote)s.quote=b[0]||s.title||'點擊編輯引言';
  if(L==='compare'&&(!s.left||!s.right)){const h=Math.ceil(b.length/2);s.left={heading:'選項 A',points:b.slice(0,h).length?b.slice(0,h):['要點']};s.right={heading:'選項 B',points:b.slice(h).length?b.slice(h):['要點']}}
  if(L==='chart'&&!s.chart)s.chart={type:'bar',labels:['A','B','C'],datasets:[{label:'數值',data:[30,50,20]}]};
  if((L==='title'||L==='section'||L==='closing')&&!s.subtitle)s.subtitle=b[0]?clip(b[0],60):'';
  if(!s.title&&L!=='quote')s.title='未命名';
  return s;
}
function convertLayout(s,L){s.layout=L;ensureFields(s,L);if(L==='split'&&!s.image)s.image=null}
function normalizeSlide(o,want,imgsOn,fallbackTitle){
  o=o&&typeof o==='object'?o:{};
  let L=LAYOUTS[o.layout]?o.layout:(want||'bullets');
  const s={layout:L,title:str(o.title,90)||fallbackTitle||'',subtitle:str(o.subtitle,140),notes:str(o.notes,700)};
  s.bullets=arrS(o.bullets,90,8);
  s.items=(Array.isArray(o.items)?o.items:[]).slice(0,6).map(x=>{
    if(typeof x==='string'){const m=x.split(/[：:]/);return{icon:'lightbulb',heading:str(m[0],14),text:str(m.slice(1).join('：')||x,80)}}
    return{icon:ICONS.includes(x?.icon)?x.icon:'lightbulb',heading:str(x?.heading||x?.title||x?.label,16),text:str(x?.text||x?.desc||x?.description,90)}
  }).filter(x=>x.heading||x.text);
  s.stats=(Array.isArray(o.stats)?o.stats:[]).slice(0,4).map(x=>({value:str(x?.value,14),label:str(x?.label||x?.text,50)})).filter(x=>x.value);
  s.quote=str(o.quote,220);s.author=str(o.author,60);
  const side=x=>x&&typeof x==='object'?{heading:str(x.heading||x.title,24),points:arrS(x.points||x.bullets,70,5)}:null;
  s.left=side(o.left);s.right=side(o.right);
  const c=o.chart;
  if(c&&Array.isArray(c.labels)&&Array.isArray(c.datasets)&&c.labels.length>=2){
    const labels=c.labels.map(x=>str(x,20)).slice(0,12);
    const ds=c.datasets.slice(0,4).map(d=>({label:str(d?.label,24)||'數值',data:labels.map((_,i)=>{const n=Number(String(d?.data?.[i]??'').replace(/[,%]/g,''));return Number.isFinite(n)?n:0})}));
    if(ds.length)s.chart={type:['bar','line','pie','doughnut'].includes(c.type)?c.type:'bar',labels,datasets:ds};
  }
  s.source=str(o.source,80);
  const q=str(o.image_query||o.imageQuery||o.image?.query,80);
  if(imgsOn&&q&&['title','bullets','split','closing'].includes(L))s.image={query:q};
  // fallbacks when data for the layout is missing
  const has={cards:s.items.length>=2,timeline:s.items.length>=2,stats:s.stats.length>=1,quote:!!s.quote,compare:s.left&&s.right&&s.left.points.length&&s.right.points.length,chart:!!s.chart};
  if(L in has&&!has[L]){const b=toBullets(s);L=b.length?'bullets':'bullets';s.layout=L}
  if(L==='split'&&!imgsOn)s.layout=L='bullets';
  if(L==='split'&&!s.image&&imgsOn)s.image={query:s.title};
  ensureFields(s,s.layout);
  return s;
}

/* ================= Images: Wikimedia Commons / Openverse ================= */
const stripHtml=h=>String(h||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/\s+/g,' ').trim();
async function commonsSearch(q,n=12,signal){
  const url='https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',generator:'search',gsrsearch:q+' filetype:bitmap',gsrnamespace:'6',gsrlimit:String(Math.min(n*2,40)),prop:'imageinfo',iiprop:'url|size|mime|extmetadata',iiurlwidth:'1024',format:'json',origin:'*'});
  const r=await fetch(url,{signal}); if(!r.ok)throw new Error('Commons HTTP '+r.status);
  const j=await r.json(); const pages=Object.values(j.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));
  const out=[];
  for(const p of pages){
    const ii=p.imageinfo?.[0]; if(!ii||!/^image\/(jpeg|png|webp)$/.test(ii.mime||''))continue;
    if(ii.width<800||ii.height<450)continue; const ratio=ii.width/ii.height; if(ratio<.7||ratio>2.8)continue;
    const md=ii.extmetadata||{};
    out.push({url:ii.thumburl||ii.url,credit:stripHtml(md.Artist?.value).slice(0,60)||'Unknown',license:stripHtml(md.LicenseShortName?.value)||'CC',page:ii.descriptionshorturl||ii.descriptionurl||'',source:'Wikimedia Commons'});
    if(out.length>=n)break;
  }
  return out;
}
async function openverseSearch(q,n=12,signal){
  const r=await fetch('https://api.openverse.org/v1/images/?'+new URLSearchParams({q,page_size:String(n),license_type:'commercial',aspect_ratio:'wide'}),{signal});
  if(!r.ok)throw new Error('Openverse HTTP '+r.status);
  const j=await r.json();
  return (j.results||[]).map(x=>({url:x.thumbnail||x.url,credit:str(x.creator||'Unknown',60),license:('CC '+String(x.license||'').toUpperCase()+' '+(x.license_version||'')).trim(),page:x.foreign_landing_url||'',source:'Openverse'}));
}
async function findImage(q,signal){
  let r=await commonsSearch(q,6,signal);
  if(!r.length){const short=q.split(/\s+/).slice(0,2).join(' ');if(short&&short!==q)r=await commonsSearch(short,6,signal)}
  return r[0]||null;
}
async function attachImage(s,signal){
  const q=s.image?.query; if(!q||s.image.url)return;
  if(deck.imgs==='none'){s.image=null;return}
  try{const r=await findImage(q,signal);s.image=r?{query:q,...r}:{query:q}}catch(e){if(signal?.aborted)throw e;s.image={query:q}}
  if(s.layout==='split'&&!s.image?.url)s.layout='bullets';
}
async function resizeImageFile(file,max=1280){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('無法讀取圖片'));i.src=url});
    const k=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.82);
  }finally{URL.revokeObjectURL(url)}
}

function ed(c,path,text,ph,cls='',tag='span'){

const fitSize=(arr,base)=>{const n=arr.length,ch=arr.join('').length;let f=base;if(n>4||ch>160)f*=.92;if(n>5||ch>230)f*=.88;if(ch>330)f*=.88;return f.toFixed(3)+'em'};

function chartConfig(s,T,fs){

function mountCharts(root){

/* ================= Slide generation ================= */
const SLIDE_SCHEMA=`各版面的 JSON 欄位:
title: {"layout":"title","title":"","subtitle":"","image_query":"英文關鍵字","notes":""}
section: {"layout":"section","title":"","subtitle":"","notes":""}
bullets: {"layout":"bullets","title":"","bullets":["3~5 點,每點 ≤ 30 字"],"image_query":"(可選)","notes":""}
split: {"layout":"split","title":"","bullets":["3~4 點"],"image_query":"英文關鍵字","notes":""}
cards: {"layout":"cards","title":"","items":[{"icon":"圖示名","heading":"≤8 字","text":"≤40 字"}],"notes":""}  (3~4 個)
stats: {"layout":"stats","title":"","subtitle":"補充說明","stats":[{"value":"72%","label":"說明"}],"notes":""}  (2~4 個)
quote: {"layout":"quote","quote":"","author":"","notes":""}
timeline: {"layout":"timeline","title":"","items":[{"heading":"階段名","text":"≤30 字"}],"notes":""}  (3~5 個)
compare: {"layout":"compare","title":"","left":{"heading":"","points":["2~4 點"]},"right":{"heading":"","points":["2~4 點"]},"notes":""}
chart: {"layout":"chart","title":"","chart":{"type":"bar|line|pie|doughnut","labels":[],"datasets":[{"label":"","data":[數字]}]},"bullets":["2~3 點解讀"],"source":"資料來源,不確定時寫「示意數據」","notes":""}

function slideSystem(d){
  return `你是專業的簡報撰稿人。請撰寫「單一頁」簡報內容。只輸出一個 JSON 物件(可放在 \`\`\`json 區塊內),不要輸出其他文字。
${SLIDE_SCHEMA}
可用的 icon 名稱:${ICONS.join(', ')}。
規則:
1. 文字要精簡有力,像簡報而不是文章;不要使用 Markdown 符號(如 ** 或 #)。
2. image_query 一律用英文,寫具體、可被拍攝的實物或場景(例如 "solar panels field"、"team meeting office"),避免抽象詞、人名與品牌。${d.imgs==='none'?'本簡報不使用圖片,請省略 image_query。':''}
3. 數字與事實只寫你有把握的內容;不確定時改用定性描述,圖表需在 source 註明「示意數據」。
4. notes 是 1~3 句講者備註(口語、可直接照講)。
5. 輸出語言:${LANGN[d.lang]}。語氣:${TONEN[d.tone]}。${settings.system.trim()?'\n額外指示:'+settings.system.trim():''}`;
}
const cleanForLLM=s=>{const o={...s};delete o.id;delete o.status;delete o.error;delete o.brief;if(o.image)o.image_query=o.image.query;delete o.image;delete o.flip;return o};
function slideUser(s,i,instr){
  const outline=deck.slides.map((x,k)=>`${k+1}. [${x.layout}] ${x.title}`).join('\n');
  let u=`簡報主題:${deck.title}\n整份大綱(避免與其他頁重複):\n${outline}\n\n現在請撰寫第 ${i+1} 頁:\n版面:${s.layout}\n標題:${s.title}\n重點說明:${s.brief||'(無)'}`;
  if(instr)u+=`\n\n此頁目前內容:\n${JSON.stringify(cleanForLLM(s))}\n\n使用者的修改指示:${instr}\n(可依指示更換版面;輸出完整的新頁 JSON)`;
  else u+=`\n(請使用 ${s.layout} 版面)`;
  if(deck.mode==='paste'&&deck.source)u+=`\n\n原始資料(內容必須忠於此資料):\n"""\n${deck.source.slice(0,12000)}\n"""`;
  return u;
}
async function genSlide(s,signal,instr){
  const i=deck.slides.indexOf(s),oldTitle=s.title;let o=null,text='';
  for(let k=0;k<2&&!o;k++){
    text=await callLLM([{role:'system',content:slideSystem(deck)},{role:'user',content:slideUser(s,i,instr)+(k?'\n\n(上次輸出無法解析,請只輸出一個合法的 JSON 物件)':'')}],signal);
    o=extractJSON(text);
  }
  const keep={id:s.id,brief:s.brief,flip:s.flip};
  if(!o){ // fallback: show model text as bullets
    const lines=text.split('\n').map(x=>x.replace(/^[\s\-*•\d.、)]+/,'').trim()).filter(Boolean).slice(0,5);
    for(const k of Object.keys(s))delete s[k];
    Object.assign(s,keep,{layout:'bullets',title:oldTitle||'',status:'ready',bullets:lines.length?lines:[s.brief||'(生成失敗,請按「AI 改寫」重試)'],notes:''});
    return;
  }
  const title=s.title;
  const n=normalizeSlide(o,s.layout,deck.imgs!=='none',title);
  for(const k of Object.keys(s))delete s[k];
  Object.assign(s,keep,n,{status:'ready'});
  await attachImage(s,signal);
}
function genUI(){
  const total=deck.slides.length,done=deck.slides.filter(x=>x.status!=='loading').length;
  const bar=$('#genbar'),active=deck.slides.some(x=>x.status==='loading')&&genCtl;
  bar.hidden=!active;if(!active)return;
  $('#genTxt').textContent=`AI 正在生成 ${done}/${total}`;$('#genFill').style.width=(done/total*100)+'%';
}
async function runGeneration(){
  genCtl?.abort();genCtl=new AbortController();const ctl=genCtl;
  const queue=deck.slides.filter(s=>s.status==='loading');
  const worker=async()=>{
    while(queue.length&&!ctl.signal.aborted){
      const s=queue.shift();
      try{await genSlide(s,ctl.signal)}catch(e){
        if(ctl.signal.aborted)break;
        s.status='error';s.error=(e.message||String(e))+(/Failed to fetch|NetworkError/i.test(e.message||'')?'\n(服務未啟動、位址錯誤,或未允許 CORS)':'');
      }
      if(ctl.signal.aborted)break;
      if(deck.slides[0]===s&&s.status==='ready'&&s.layout==='title'&&!deck.title)deck.title=s.title;
      refreshCard(s.id);genUI();touch();
    }
  };
  genUI();
  await Promise.all(Array.from({length:Math.min(4,Math.max(1,+settings.conc||2))},worker));
  if(ctl.signal.aborted){for(const s of deck.slides)if(s.status==='loading'){s.status='error';s.error='已停止生成'}}
  genCtl=null;genUI();renderEditor();saveDecks();
  const bad=deck.slides.filter(s=>s.status==='error').length;
  toast(ctl.signal.aborted?'已停止':bad?`完成,但有 ${bad} 頁失敗,可在該頁按「重試」`:'簡報生成完成 ✦',bad?'err':'');
}
function startGenerate(){
  deck.slides=deck.outline.map(o=>({id:uid(),layout:o.layout,title:o.title,brief:o.brief,status:'loading'}));
  if(!decks.includes(deck))decks.unshift(deck);
  deck.updated=Date.now();saveDecks();
  show('editor');renderEditor();runGeneration();
}

  const s=slideById(sel.closest('.cwrap').dataset.id);convertLayout(s,sel.value);
  if(s.layout==='split'&&!s.image?.url&&deck.imgs!=='none'){s.image={query:s.title};touch();refreshCard(s.id);attachImage(s).then(()=>{refreshCard(s.id);touch()});return}
  touch();refreshCard(s.id);
});
const DEFAULT_ITEM={bullets:()=>'新的要點',items:()=>({icon:'lightbulb',heading:'小標',text:'說明'}),stats:()=>({value:'0',label:'說明'})};
$('#cards').addEventListener('click',async e=>{
  const w=e.target.closest('.cwrap'),ins=e.target.closest('.ins');
  if(ins){openInsertMenu(ins.dataset.after,e.target.closest('button'));return}
  if(!w)return;const s=slideById(w.dataset.id);
  const add=e.target.closest('[data-add]');
  if(add){const p=add.dataset.add,arr=getPath(s,p);if(Array.isArray(arr)){arr.push((DEFAULT_ITEM[p]||DEFAULT_ITEM.bullets)());touch();refreshCard(s.id)}return}
  const del=e.target.closest('[data-del]');
  if(del){const ks=del.dataset.del.split('.'),idx=+ks.pop(),arr=getPath(s,ks.join('.'));if(Array.isArray(arr)&&arr.length>1){arr.splice(idx,1);touch();refreshCard(s.id)}else toast('至少保留一項');return}
  if(e.target.closest('[data-act="image"]')){openImagePicker(s);return}
  const tool=e.target.closest('[data-tool]')?.dataset.tool;
  if(!tool)return;
  if(tool==='ai')openAI(s);
  else if(tool==='image')openImagePicker(s);
  else if(tool==='chart')openChartEditor(s);
  else if(tool==='flip'){s.flip=!s.flip;touch();refreshCard(s.id)}
  else if(tool==='notes'){s.notesOpen=!s.notesOpen;w.classList.toggle('shownotes',!!s.notesOpen)}
  else if(tool==='dup'){const c=JSON.parse(JSON.stringify(s));c.id=uid();insertSlide(s.id,c)}
  else if(tool==='del'){if(deck.slides.length<=1)return toast('至少保留一頁');if(confirm('刪除這一頁?')){deck.slides=deck.slides.filter(x=>x.id!==s.id);touch();renderEditor()}}
  else if(tool==='retry'){s.status='loading';refreshCard(s.id);genUI();runGeneration()}
});

/* insert menu */
function openInsertMenu(afterId,btn){
  $('#insMenu')?.remove();
  const m=document.createElement('div');m.id='insMenu';m.className='pop';m.style.cssText='position:fixed;min-width:170px;z-index:60';
  m.innerHTML='<button class="item" data-i="blank">＋ 空白頁</button><button class="item" data-i="ai">✦ AI 生成一頁</button>';
  const r=btn.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-190)+'px';m.style.top=Math.min(r.bottom+4,innerHeight-110)+'px';
  document.body.append(m);
  m.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;m.remove();
    if(b.dataset.i==='blank')insertSlide(afterId,blankSlide());else openAI(null,afterId)};
  setTimeout(()=>document.addEventListener('click',function f(ev){if(!m.contains(ev.target)){m.remove()}document.removeEventListener('click',f)},{once:false}),0);
}

/* AI rewrite / add dialog */
let aiCtx=null;
const AI_CHIPS=['更精簡','加入具體例子','語氣更口語','改成卡片版面','改成圖表','改成流程/時間軸','翻譯成英文'];
function openAI(s,afterId){
  aiCtx={s,afterId};
  $('#aiHead').textContent=s?'AI 改寫此頁':'AI 生成新的一頁';
  $('#aiText').value='';$('#aiText').placeholder=s?'想怎麼改?例如:更精簡、加入具體例子、改成卡片版面…':'這一頁想談什麼?例如:競品比較、三個執行步驟、關鍵成長數據…';
  $('#aiChips').innerHTML=s?AI_CHIPS.map(c=>`<button type="button">${c}</button>`).join(''):'';
  $('#aiDlg').showModal();$('#aiText').focus();
}
$('#aiChips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)$('#aiText').value=b.textContent});
$('#aiCancel').addEventListener('click',()=>$('#aiDlg').close());
$('#aiOk').addEventListener('click',async()=>{
  const instr=$('#aiText').value.trim();if(!instr)return toast('請輸入指示','err');
  $('#aiDlg').close();
  let s=aiCtx.s;
  if(!s){s={id:uid(),layout:'bullets',title:clip(instr,30),brief:instr,status:'loading'};insertSlide(aiCtx.afterId,s)}

/* chart data editor */

  chartCtx=s;const c=s.chart||{type:'bar',labels:[],datasets:[]};
  $('#chType').value=c.type;
  const head=['類別',...c.datasets.map(d=>d.label)].join(',');

/* ================= Present mode ================= */
let pIdx=0,pNotes=false;
function sizeStage(){const st=$('#stage'),w=Math.min(innerWidth,innerHeight*16/9);st.style.width=w+'px';st.style.height=(w*9/16)+'px'}
function renderPresent(first){
  const s=deck.slides[pIdx];destroyCharts($('#stage'));
  $('#stage').innerHTML=`<div class="${first?'':'fade'}">${slideInner(s,pIdx,{})}</div>`;mountCharts($('#stage'));
  $('#pbar').style.width=((pIdx+1)/deck.slides.length*100)+'%';$('#pinfo').textContent=`${pIdx+1} / ${deck.slides.length}`;
  const pn=$('#pnotes');pn.hidden=!(pNotes&&s.notes);pn.textContent=s.notes||'';
}
function startPresent(i=0){
  if(!deck?.slides.length)return;pIdx=Math.min(i,deck.slides.length-1);$('#present').hidden=false;sizeStage();renderPresent(true);
  try{$('#present').requestFullscreen?.()}catch{}
}
function endPresent(){$('#present').hidden=true;destroyCharts($('#stage'));$('#stage').innerHTML='';if(document.fullscreenElement)document.exitFullscreen?.()}
function pgo(d){const n=Math.max(0,Math.min(deck.slides.length-1,pIdx+d));if(n!==pIdx){pIdx=n;renderPresent()}}
document.addEventListener('keydown',e=>{
  if($('#present').hidden)return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();pgo(1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();pgo(-1)}
  else if(e.key==='Home')pgo(-999);else if(e.key==='End')pgo(999);
  else if(e.key==='n'||e.key==='N'){pNotes=!pNotes;renderPresent()}
  else if(e.key==='Escape')endPresent();
});
$('#present').addEventListener('click',e=>{if(e.target.closest('#pexit')){endPresent();return}pgo(e.clientX<innerWidth*.3?-1:1)});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&!$('#present').hidden)endPresent()});
addEventListener('resize',()=>{if(!$('#present').hidden)sizeStage()});
$('#btnPresent').addEventListener('click',()=>{const w=document.elementFromPoint(innerWidth/2,innerHeight/2)?.closest?.('.cwrap');startPresent(0)});


/* ================= Export: PPTX ================= */
const hx=c=>String(c).replace('#','');
async function fetchDataUrl(url){
  if(String(url).startsWith('data:'))return url;
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  const b=await r.blob();return await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src});
async function cropImage(dataUrl,wIn,hIn,shade){
  const img=await loadImg(dataUrl),W=Math.round(wIn*140),H=Math.round(hIn*140),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d'),r=Math.max(W/img.width,H/img.height),dw=img.width*r,dh=img.height*r;
  g.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  if(shade){const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'rgba(0,0,0,.74)');gr.addColorStop(1,'rgba(0,0,0,.2)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
  return cv.toDataURL('image/jpeg',.86);
}
const iconCache={};
async function iconPng(name,color){
  const k=name+color;if(iconCache[k])return iconCache[k];
  const svg=iconSvg(name,color,96),img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
  const cv=document.createElement('canvas');cv.width=cv.height=96;cv.getContext('2d').drawImage(img,0,0,96,96);
  return iconCache[k]=cv.toDataURL('image/png');
}
async function exportPptx(){
  if(typeof PptxGenJS==='undefined')return toast('PptxGenJS 載入失敗(請檢查網路連線)','err');
  toast('正在產生 PPTX…');
  const T=THEMES[deck.themeId]||THEMES.clean,pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.title=deck.title||'簡報';
  const SH=pptx.ShapeType,W=13.333,H=7.5;let failedImg=0;
  const dataFor=async im=>{if(!im?.url)return null;try{return await fetchDataUrl(im.url)}catch{failedImg++;return null}};
  const txt=(sl,t,o)=>sl.addText(String(t??''),{fontFace:T.pf,color:hx(T.fg),margin:0,fit:'shrink',valign:'top',...o});
  const rect=(sl,o)=>sl.addShape(SH.rect,{line:{color:hx(o.fill),width:0},...o,fill:{color:hx(o.fill)}});
  const rrect=(sl,o)=>sl.addShape(SH.roundRect,{line:{color:hx(o.fill),width:0},rectRadius:.12,...o,fill:{color:hx(o.fill)}});
  const credit=(sl,im,x,y)=>{if(im?.credit)txt(sl,`圖片:${im.credit}・${im.license||''}${im.source?'・'+im.source:''}`,{x,y,w:6,h:.22,fontSize:8,color:'FFFFFF',valign:'middle'})};
  const title=(sl,s)=>{txt(sl,s.title,{x:.7,y:.45,w:11.9,h:.95,fontFace:T.hpf,fontSize:30,bold:true,valign:'middle'});rect(sl,{x:.7,y:1.42,w:.9,h:.07,fill:T.accent})};
  const bullets=(sl,arr,o)=>sl.addText(arr.map(t=>({text:t,options:{bullet:{code:'25CF'},breakLine:true,paraSpaceAfter:12}})),{fontFace:T.pf,color:hx(T.fg),margin:0,fit:'shrink',valign:'top',...o});
  const sizeFor=arr=>{const ch=arr.join('').length;return arr.length>5||ch>230?16:arr.length>4||ch>160?18:21};
  for(const [i,s] of deck.slides.entries()){
    const sl=pptx.addSlide();sl.background={color:hx(T.bg)};
    const L=s.layout,im=s.image,imgData=await dataFor(im);
    if(L==='title'||L==='closing'||L==='section'){
      sl.background={color:hx(L==='section'?T.cB:T.cA)};
      if(imgData&&L!=='section'){sl.addImage({data:await cropImage(imgData,W,H,true),x:0,y:0,w:W,h:H});credit(sl,im,.4,7.15)}
      else{sl.addShape(SH.ellipse,{x:9.2,y:-1.6,w:6,h:6,fill:{color:'FFFFFF',transparency:88},line:{color:'FFFFFF',width:0}});sl.addShape(SH.ellipse,{x:-1.2,y:5.4,w:4.4,h:4.4,fill:{color:hx(T.accent2),transparency:70},line:{color:hx(T.accent2),width:0}})}
      const ctr=L==='closing',x=ctr?1.2:.9,w=ctr?10.9:9.3;
      if(L==='section')txt(sl,String(deck.slides.slice(0,i+1).filter(q=>q.layout==='section').length).padStart(2,'0'),{x,y:1.7,w:3,h:1.3,fontFace:T.hpf,fontSize:60,bold:true,color:'FFFFFF',transparency:70});
      txt(sl,s.title,{x,y:L==='section'?3.1:2.3,w,h:1.9,fontFace:T.hpf,fontSize:L==='section'?40:44,bold:true,color:'FFFFFF',valign:'middle',align:ctr?'center':'left'});
      rect(sl,{x:ctr?W/2-.6:x,y:L==='section'?5.05:4.25,w:1.2,h:.09,fill:T.accent2});
      if(s.subtitle)txt(sl,s.subtitle,{x,y:L==='section'?5.3:4.5,w:w-.6,h:1.1,fontSize:20,color:'FFFFFF',align:ctr?'center':'left'});
    }else if(L==='bullets'||L==='split'){
      const b=s.bullets||[];
      if(L==='split'){
        const left=!s.flip,px=left?0:W-5.6,tx=left?6.2:.8;
        if(imgData){sl.addImage({data:await cropImage(imgData,5.6,H),x:px,y:0,w:5.6,h:H});credit(sl,im,left?.2:px+.2,7.15)}else rect(sl,{x:px,y:0,w:5.6,h:H,fill:T.card});
        txt(sl,s.title,{x:tx,y:.6,w:6.3,h:1.1,fontFace:T.hpf,fontSize:28,bold:true,valign:'middle'});rect(sl,{x:tx,y:1.75,w:.9,h:.07,fill:T.accent});
        bullets(sl,b,{x:tx,y:2.2,w:6.2,h:4.6,fontSize:sizeFor(b)-1});
      }else{
        title(sl,s);const has=!!imgData;
        bullets(sl,b,{x:.7,y:1.9,w:has?6.6:11.9,h:4.9,fontSize:sizeFor(b)+(has?0:2)});
        if(has){sl.addImage({data:await cropImage(imgData,5,4.9),x:7.65,y:1.9,w:5,h:4.9});credit(sl,im,7.75,6.5)}
      }
    }else if(L==='cards'){
      title(sl,s);const it=(s.items||[]).slice(0,6),n=it.length>4?3:it.length||1,rows=it.length>4?2:1,gap=.3,cw=(11.9-gap*(n-1))/n,ch=rows===1?4.2:2.5;
      for(const [k,x] of it.entries()){
        const cx=.7+(k%n)*(cw+gap),cy=1.95+Math.floor(k/n)*(ch+gap);
        rrect(sl,{x:cx,y:cy,w:cw,h:ch,fill:T.card});
        sl.addShape(SH.ellipse,{x:cx+.3,y:cy+.3,w:.7,h:.7,fill:{color:hx(T.accent)},line:{color:hx(T.accent),width:0}});
        try{sl.addImage({data:await iconPng(x.icon,T.onAccent),x:cx+.46,y:cy+.46,w:.38,h:.38})}catch{}
        txt(sl,x.heading,{x:cx+.3,y:cy+1.15,w:cw-.6,h:.5,fontFace:T.hpf,fontSize:18,bold:true,valign:'middle'});
        txt(sl,x.text,{x:cx+.3,y:cy+1.7,w:cw-.6,h:ch-1.9,fontSize:14,color:hx(T.muted)});

    }else if(L==='stats'){
      title(sl,s);if(s.subtitle)txt(sl,s.subtitle,{x:.7,y:1.65,w:11.9,h:.4,fontSize:15,color:hx(T.muted)});
      const st=s.stats||[],n=st.length||1,gap=.5,cw=(11.9-gap*(n-1))/n;
      st.forEach((x,k)=>{const cx=.7+k*(cw+gap);rect(sl,{x:cx,y:2.7,w:cw,h:.07,fill:T.accent});
        txt(sl,x.value,{x:cx,y:2.95,w:cw,h:1.4,fontFace:T.hpf,fontSize:54,bold:true,color:hx(T.accent),valign:'middle'});
        txt(sl,x.label,{x:cx,y:4.45,w:cw,h:1.2,fontSize:18,color:hx(T.muted)})});
    }else if(L==='quote'){
      sl.background={color:hx(T.card)};
      txt(sl,'“',{x:1.2,y:.9,w:2,h:1.6,fontFace:'Georgia',fontSize:120,color:hx(T.accent),bold:true});
      txt(sl,s.quote,{x:1.4,y:2.4,w:10.5,h:2.9,fontFace:T.hpf,fontSize:32,bold:true,valign:'middle'});
      if(s.author)txt(sl,'— '+s.author,{x:1.4,y:5.5,w:10.5,h:.5,fontSize:18,color:hx(T.muted)});
    }else if(L==='timeline'){
      title(sl,s);const it=(s.items||[]).slice(0,5),n=it.length||1,gap=.3,cw=(11.9-gap*(n-1))/n;
      it.forEach((x,k)=>{const cx=.7+k*(cw+gap);
        if(k<n-1)rect(sl,{x:cx+.75,y:2.55,w:cw+gap-.75,h:.05,fill:T.accent});
        sl.addShape(SH.ellipse,{x:cx,y:2.3,w:.55,h:.55,fill:{color:hx(T.accent)},line:{color:hx(T.accent),width:0}});
        txt(sl,String(k+1),{x:cx,y:2.3,w:.55,h:.55,fontSize:16,bold:true,color:hx(T.onAccent),align:'center',valign:'middle'});
        txt(sl,x.heading,{x:cx,y:3.15,w:cw,h:.6,fontFace:T.hpf,fontSize:18,bold:true,valign:'middle'});
        txt(sl,x.text,{x:cx,y:3.85,w:cw,h:2.4,fontSize:14,color:hx(T.muted)})});
    }else if(L==='compare'){
      title(sl,s);[['left',T.accent],['right',T.accent2]].forEach(([k,col],q)=>{
        const d=s[k]||{heading:'',points:[]},cx=.7+q*6.15;
        rrect(sl,{x:cx,y:1.95,w:5.75,h:4.7,fill:T.card});rect(sl,{x:cx,y:1.95,w:5.75,h:.75,fill:col});
        txt(sl,d.heading,{x:cx+.3,y:1.95,w:5.2,h:.75,fontFace:T.hpf,fontSize:20,bold:true,color:hx(col===T.accent?T.onAccent:'#ffffff'),valign:'middle'});
        bullets(sl,d.points||[],{x:cx+.35,y:3.0,w:5.1,h:3.4,fontSize:sizeFor(d.points||[])-2})});
    }else if(L==='chart'){
      title(sl,s);const c=s.chart,b=s.bullets||[];
      if(c){const typ={bar:pptx.charts.BAR,line:pptx.charts.LINE,pie:pptx.charts.PIE,doughnut:pptx.charts.DOUGHNUT}[c.type]||pptx.charts.BAR,circ=c.type==='pie'||c.type==='doughnut';
        const data=c.datasets.map(d=>({name:d.label||'數值',labels:c.labels,values:d.data}));
        sl.addChart(typ,data,{x:.7,y:1.9,w:b.length?7.2:11.9,h:4.9,chartColors:palette(T,circ?c.labels.length:c.datasets.length).map(hx),showLegend:circ||data.length>1,legendPos:'b',legendFontSize:12,legendColor:hx(T.fg),catAxisLabelColor:hx(T.muted),valAxisLabelColor:hx(T.muted),catAxisLabelFontSize:12,valAxisLabelFontSize:12,valGridLine:{color:'E5E7EB',size:.5},showValue:circ,dataLabelFontSize:12,dataLabelColor:circ?'FFFFFF':hx(T.fg)})}
      if(b.length)bullets(sl,b,{x:8.3,y:2.2,w:4.3,h:4.3,fontSize:sizeFor(b)-2});
      if(s.source)txt(sl,s.source,{x:.7,y:6.95,w:8,h:.3,fontSize:10,color:hx(T.muted)});
    }
    if(!['title','section','closing'].includes(L))txt(sl,String(i+1),{x:12.3,y:7.05,w:.6,h:.3,fontSize:10,color:hx(T.muted),align:'right'});
    if(s.notes)sl.addNotes(s.notes);
  }
  await pptx.writeFile({fileName:safeName(deck.title)+'.pptx'});
  toast(failedImg?`PPTX 已下載(${failedImg} 張圖片因無法讀取被略過)`:'PPTX 已下載 ✦');
}

/* ================= Export: PDF / JSON ================= */
async function exportPdf(){
  const root=$('#printRoot');root.innerHTML=deck.slides.map((s,i)=>`<div class="pslide"><div class="cqp">${slideInner(s,i,{})}</div></div>`).join('');
  mountCharts(root);await sleep(500);
  document.body.classList.add('printing');toast('請在列印視窗選擇「另存為 PDF」,並關閉頁首頁尾');
  setTimeout(()=>window.print(),100);
}
addEventListener('afterprint',()=>{if(document.body.classList.contains('printing')){document.body.classList.remove('printing');destroyCharts($('#printRoot'));$('#printRoot').innerHTML=''}});
function exportJson(){download(new Blob([JSON.stringify(deck,null,1)],{type:'application/json'}),safeName(deck.title)+'.deck.json');toast('已匯出專案檔')}
$('#fileImport').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.slides))throw new Error('格式不符');d.id=uid();d.updated=Date.now();d.themeId=THEMES[d.themeId]?d.themeId:'clean';decks.unshift(d);saveDecks();renderHome();toast('已匯入')}
  catch(err){toast('匯入失敗:'+(err.message||err),'err')}
});

/* ================= Header / popovers ================= */
function renderThemePop(){
  $('#themeGrid').innerHTML=Object.entries(THEMES).map(([k,T])=>`<button class="tsw ${k===deck.themeId?'on':''}" data-k="${k}"><div class="pv" style="background:${T.bg};color:${T.fg}"><b style="font-family:${T.head.replace(/"/g,'')}">Aa 標題</b><i style="background:${T.accent}"></i></div><span class="nm">${T.name}</span></button>`).join('');
}
$('#btnTheme').addEventListener('click',e=>{e.stopPropagation();$('#exportPop').hidden=true;renderThemePop();$('#themePop').hidden=!$('#themePop').hidden});
$('#themeGrid').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;deck.themeId=b.dataset.k;touch();renderThemePop();renderEditor()});
$('#btnExport').addEventListener('click',e=>{e.stopPropagation();$('#themePop').hidden=true;$('#exportPop').hidden=!$('#exportPop').hidden});
$('#exportPop').addEventListener('click',e=>{const b=e.target.closest('[data-exp]');if(!b)return;$('#exportPop').hidden=true;
  ({pptx:exportPptx,pdf:exportPdf,json:exportJson})[b.dataset.exp]().catch(err=>toast('匯出失敗:'+(err.message||err),'err'))});
document.addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('#btnTheme,#btnExport')){$('#themePop').hidden=true;$('#exportPop').hidden=true}});
$('#deckTitle').addEventListener('input',e=>{deck.title=e.target.value;touch()});
$('#btnHome').addEventListener('click',()=>{if(genCtl&&!confirm('簡報仍在生成中,離開會停止生成。確定離開?'))return;genCtl?.abort();outCtl?.abort();saveDecks();show('home')});
$('#btnDark').addEventListener('click',()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;store.set('deckai.dark',d)});
document.documentElement.dataset.theme=store.get('deckai.dark',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

/* home */
$$('.seg button').forEach(b=>b.addEventListener('click',()=>{prefs.mode=b.dataset.mode;store.set('deckai.prefs',prefs);renderHome()}));
$('#sugg').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){$('#pPrompt').value=b.dataset.s;$('#pPrompt').focus()}});
$('#btnOutline').addEventListener('click',makeOutline);
$('#pPrompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();makeOutline()}});
$('#deckGrid').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){e.stopPropagation();if(confirm('刪除這份簡報?'))decks=decks.filter(x=>x.id!==d.dataset.del),saveDecks(),renderHome();return}
  const c=e.target.closest('.dk');if(c)openDeck(c.dataset.id);
});
$('#btnImport').addEventListener('click',()=>$('#fileImport').click());

/* outline */
$('#olList').addEventListener('input',e=>{const r=e.target.closest('.olrow');if(r)deck.outline[+r.dataset.i][e.target.dataset.f]=e.target.value});
$('#olList').addEventListener('change',e=>{const r=e.target.closest('.olrow');if(r&&e.target.dataset.f==='layout')deck.outline[+r.dataset.i].layout=e.target.value});
$('#olList').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;if(deck.outline.length<=1)return toast('至少保留一頁');deck.outline.splice(+b.dataset.rm,1);renderOutline()});
$('#olTitle').addEventListener('input',e=>deck.title=e.target.value);
$('#olAdd').addEventListener('click',()=>{deck.outline.splice(Math.max(1,deck.outline.length-1),0,{title:'新的一頁',layout:'bullets',brief:''});renderOutline()});
$('#olBack').addEventListener('click',()=>show('home'));
$('#olStop').addEventListener('click',()=>{outCtl?.abort();show('home')});
$('#olRegen').addEventListener('click',runOutline);
$('#olGo').addEventListener('click',startGenerate);
$('#olErr').addEventListener('click',e=>{if(e.target.id==='olErrBack')show('home');if(e.target.id==='olErrRetry')runOutline()});

/* settings */
const dlg=$('#settings');
function fillSettings(){
  const p=$('#provider').value,cfg=cfgOf(p),def=PROVIDERS[p];
  $('#providerNote').innerHTML=def.note;
  $('#fBase').style.display='baseUrl' in def.defaults?'':'none';$('#fKey').style.display='apiKey' in def.defaults?'':'none';
  $('#baseUrl').value=cfg.baseUrl||'';$('#apiKey').value=cfg.apiKey||'';$('#model').value=cfg.model||'';
  $('#modelList').innerHTML=def.models.map(m=>`<option value="${m}">`).join('');$('#testMsg').textContent='';
}
function openSettings(){$('#provider').value=settings.provider;fillSettings();$('#system').value=settings.system;$('#temp').value=settings.temp;$('#conc').value=settings.conc;dlg.showModal()}
$('#chip').addEventListener('click',openSettings);
$('#provider').addEventListener('change',fillSettings);
$('#cancelSettings').addEventListener('click',()=>dlg.close());
$('#settingsForm').addEventListener('submit',()=>{
  const p=$('#provider').value,def=PROVIDERS[p].defaults,cfg={model:$('#model').value.trim()};
  if('baseUrl' in def)cfg.baseUrl=$('#baseUrl').value.trim();if('apiKey' in def)cfg.apiKey=$('#apiKey').value.trim();
  settings.provider=p;settings.cfg[p]=cfg;settings.system=$('#system').value;settings.temp=$('#temp').value;
  settings.conc=Math.min(4,Math.max(1,parseInt($('#conc').value)||2));
  store.set('deckai.settings',settings);renderChip();
});
$('#fetchModels').addEventListener('click',async()=>{
  const p=$('#provider').value,msg=$('#testMsg'),base=$('#baseUrl').value.trim().replace(/\/+$/,''),key=$('#apiKey').value.trim();
  msg.className='';msg.textContent='讀取中…';
  try{
    let names=[];
    if(p==='puter'){if(typeof puter==='undefined'||!puter.ai?.listModels)throw new Error('目前的 puter.js 不支援列出模型,請手動輸入。');names=(await puter.ai.listModels()).map(x=>x.id||x)}
    else if(p==='ollama'){const r=await fetch(base+'/api/tags');if(!r.ok)throw await httpError(r);names=(await r.json()).models.map(m=>m.name)}
    else{const r=await fetch(base+'/models',{headers:key?{Authorization:'Bearer '+key}:{}});if(!r.ok)throw await httpError(r);names=(await r.json()).data.map(m=>m.id)}
    if(!names.length)throw new Error('沒有找到任何模型。');
    $('#modelList').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
    if(!$('#model').value||!names.includes($('#model').value))$('#model').value=names[0];
    msg.className='ok';msg.textContent=`✓ 取得 ${names.length} 個模型(點模型欄位選擇)`;
  }catch(e){msg.className='bad';msg.textContent='✕ '+(e.message||e)+(/Failed to fetch/i.test(e.message||'')?'(服務未啟動或未允許 CORS)':'')}
});

/* ================= Init ================= */
show('home');

</script>
